<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  GRÁFICO DESTACADO de Play Store — 1024×500.

  Se renderiza con `node store-assets/capture-screens.mjs`.

  Reglas que Google aplica a esta imagen y que aquí se respetan:
  · En muchos listados aparece RECORTADA por los bordes y con el botón de
    "Instalar" encima del tercio inferior. Todo lo que importa vive en la
    banda central, lejos de los bordes.
  · Nada de capturas de pantalla dentro: se rechazan.
  · El texto debe leerse en miniatura, así que hay una frase y no tres.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }

  body {
    align-items: center;
    /* El verde profundo de la marca, con dos focos del turquesa y el oro de
       las tarjetas del ícono. Antes era azul marino con focos azules: el
       color de la mitad de la tienda. */
    background: #06211F;
    background-image:
      radial-gradient(620px 460px at 84% 14%, rgba(95, 235, 201, .22), transparent 68%),
      radial-gradient(520px 420px at 6% 104%, rgba(245, 182, 43, .14), transparent 70%);
    color: #EDF2EE;
    display: flex;
    font-family: 'Archivo', system-ui, sans-serif;
    position: relative;
    width: 1024px;
    height: 500px;
  }

  /* Trama de puntos al paso de la rejilla del sistema de diseño: da textura
     sin competir con el texto. Se desvanece hacia la izquierda para que el
     titular quede sobre fondo limpio. */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.075) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(100deg, transparent 34%, #000 78%);
    mask-image: linear-gradient(100deg, transparent 34%, #000 78%);
  }

  .content {
    align-items: center;
    display: flex;
    gap: 64px;
    padding: 0 72px;
    position: relative;
    width: 100%;
  }

  .text { display: flex; flex-direction: column; gap: 18px; flex: 1; }

  .brand {
    align-items: baseline;
    display: flex;
    gap: 14px;
  }
  .brand h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 76px;
    font-weight: 600;
    letter-spacing: -.03em;
    line-height: .9;
  }
  .brand span {
    color: #5FEBC9;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .claim {
    color: #A9C4BC;
    font-size: 27px;
    font-weight: 500;
    line-height: 1.32;
    max-width: 19ch;
  }
  .claim b { color: #EDF2EE; font-weight: 800; }

  .chips { display: flex; gap: 10px; margin-top: 4px; }
  .chip {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    padding: 8px 16px;
  }

  /* Las dos tarjetas del ícono, a tamaño grande. Es la misma marca, no una
     ilustración distinta hecha para esta imagen. */
  .art { flex: 0 0 auto; height: 340px; position: relative; width: 340px; }
  .card {
    border-radius: 26px;
    height: 128px;
    position: absolute;
    width: 206px;
  }
  .card-back {
    background: linear-gradient(135deg, #FFD166, #F09F1A);
    left: 22px;
    top: 44px;
    transform: rotate(-9deg);
  }
  .card-shadow {
    background: #04120F;
    left: 92px;
    opacity: .3;
    top: 138px;
    transform: rotate(7deg);
  }
  .card-front {
    background: linear-gradient(135deg, #5FEBC9, #17A38E);
    left: 92px;
    top: 138px;
    transform: rotate(7deg);
  }
  .card-front::after {
    background: #08332D;
    border-radius: 7px;
    content: '';
    height: 14px;
    left: 22px;
    opacity: .42;
    position: absolute;
    top: 78px;
    width: 86px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="text">
      <div class="brand">
        <h1>Cuadre</h1>
        <span>RD</span>
      </div>
      <p class="claim">Tus gastos, tus tarjetas y tus dólares, <b>en un solo lugar</b>.</p>
      <div class="chips">
        <span class="chip">Pesos y dólares</span>
        <span class="chip">Tarjetas de crédito</span>
      </div>
    </div>
    <div class="art">
      <div class="card card-back"></div>
      <div class="card card-shadow"></div>
      <div class="card card-front"></div>
    </div>
  </div>
</body>
</html>
