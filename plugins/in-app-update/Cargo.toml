[package]
name = "tauri-plugin-in-app-update"
version = "0.1.0"
edition = "2021"
description = "Actualizacion dentro de la app via Google Play In-App Updates"
links = "tauri-plugin-in-app-update"

[lib]
name = "tauri_plugin_in_app_update"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
