[package]
name        = "sharky"
version = "1.9.1"
description = "$harky - Finanzas personales"
edition     = "2021"

[lib]
name       = "sharky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                    = { version = "2", features = [] }
tauri-plugin-fs          = "2"
tauri-plugin-opener      = "2"
tauri-plugin-dialog      = "2"
tauri-plugin-deep-link   = "2"
tauri-plugin-biometric   = "2"
tauri-plugin-notification = "2"
tauri-plugin-mlkit-ocr   = { path = "../plugins/mlkit-ocr" }
tauri-plugin-local-reminders = { path = "../plugins/local-reminders" }
tauri-plugin-bank-notifications = { path = "../plugins/bank-notifications" }
tauri-plugin-keystore = { path = "../plugins/keystore" }
tauri-plugin-home-widget = { path = "../plugins/home-widget" }
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
keyring                  = { version = "3", features = ["windows-native"] }
base64                   = "0.22"
