name: CI

# Puerta de release (roadmap P0): un release no debe poder salir si lint,
# typecheck, tests o el build web fallan. cargo check corre aparte porque
# necesita el toolchain de Rust y valida que el lado Tauri compile.
on:
  # TODAS las ramas, no solo main. El trabajo del dia a dia ocurre en ramas de
  # feature y se empuja a mano: con el filtro a `main`, la puerta se abria
  # justo despues de que ya fuera tarde para cerrarla.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, tests, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Pruebas de extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Aqui vive la guardia de desbordamiento (320px con la letra al 135%),
      # que es la que ha cazado los fallos que los tests unitarios no ven:
      # controles fuera de pantalla, imposibles de tocar.
      - run: npm run test:e2e

  cargo-check:
    name: cargo check (Tauri desktop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  android-kotlin:
    name: Compilar los plugins de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - run: npm ci

      # POR QUE HACE FALTA TODO ESTO PARA "SOLO COMPILAR KOTLIN".
      #
      # `gen/android/settings.gradle` hace `apply from: 'tauri.settings.gradle'`,
      # y ese archivo esta en .gitignore porque lo GENERA tauri-build con las
      # rutas ABSOLUTAS de la maquina que compila (el crate de tauri vive en el
      # registro de cargo, distinto en cada equipo).
      #
      # Sin generarlo, gradle muere evaluando settings en ~19s. Ese era el fallo
      # que tuvo este job en rojo desde julio: no fallaba el codigo, fallaba que
      # el proyecto ni siquiera se podia abrir.
      #
      # Compilar de verdad cuesta minutos de CI. Se paga a gusto: el hueco que
      # esto tapa dejo pasar la rotura de Play Billing 7->8 y, mas tarde, un
      # error de tipos en el plugin de auto-update que solo aparecio al
      # empaquetar a mano.
      - name: Generar el proyecto Gradle (tauri-build)
        run: npx tauri android build --debug --target aarch64 --apk
        env:
          # La firma no hace falta: un APK de debug se firma solo. Lo que
          # importa es que el Kotlin y el Rust compilen.
          NDK_HOME: ${{ env.NDK_HOME }}
