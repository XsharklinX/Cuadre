<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>$harky — Finanzas personales</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  ::selection { background: color-mix(in oklab, var(--accent) 40%, transparent); }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  /* ───────────── TEMAS ───────────── */
  .app {
    --accent2: #22d3ee;
    --income:  #2ecc8f;
    --expense: #f65574;
    --card-pad: 20px;
    --gap: 16px;
    --radius: 16px;
    min-height: 100vh;
    display: grid;
    grid-template-columns: auto 1fr;
  }
  .app[data-theme="midnight"] {
    --bg: #0a0e16; --surface: #111827; --surface-2: #151d2e;
    --text: #e9eef7; --text-dim: #8a96ac;
    --border: rgba(255,255,255,.065);
    --track: rgba(255,255,255,.07); --track-strong: rgba(255,255,255,.14);
    --bg-glow: radial-gradient(1200px 600px at 78% -8%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%);
  }
  .app[data-theme="slate"] {
    --bg: #11161d; --surface: #1a212b; --surface-2: #202833;
    --text: #e6ecf3; --text-dim: #8b97a9;
    --border: rgba(255,255,255,.07);
    --track: rgba(255,255,255,.08); --track-strong: rgba(255,255,255,.16);
    --bg-glow: radial-gradient(1100px 560px at 82% -10%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 58%);
  }
  .app[data-theme="carbon"] {
    --bg: #0b0c0e; --surface: #151618; --surface-2: #1b1d20;
    --text: #ededee; --text-dim: #8c8e94;
    --border: rgba(255,255,255,.06);
    --track: rgba(255,255,255,.06); --track-strong: rgba(255,255,255,.13);
    --bg-glow: none;
  }
  .app[data-density="compact"] { --card-pad: 14px; --gap: 12px; --radius: 13px; }
  .app[data-density="comfy"]   { --card-pad: 26px; --gap: 22px; --radius: 18px; }

  /* ───────────── SIDEBAR ───────────── */
  .sidebar {
    width: 232px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 22px 16px; gap: 8px;
    position: sticky; top: 0; height: 100vh; overflow: hidden;
  }
  .app[data-density="compact"] .sidebar { width: 210px; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    color: #fff; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent) 60%, var(--accent2)));
    box-shadow: 0 4px 14px color-mix(in oklab, var(--accent) 40%, transparent);
  }
  .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .sidebar nav { display: flex; flex-direction: column; gap: 3px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px;
    border: none; background: transparent; color: var(--text-dim); font-size: 13.5px; font-weight: 550;
    text-align: left; width: 100%; transition: all .14s ease; white-space: nowrap;
  }
  .nav-item:hover { background: var(--track); color: var(--text); }
  .nav-item.on { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--accent); font-weight: 650; }
  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .add-fab {
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px;
    border-radius: 12px; border: none; font-size: 13.5px; font-weight: 650; color: #fff;
    background: var(--accent); transition: filter .15s, transform .1s;
    box-shadow: 0 6px 18px color-mix(in oklab, var(--accent) 35%, transparent);
  }
  .add-fab:hover { filter: brightness(1.08); }
  .add-fab:active { transform: translateY(1px); }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 11px; cursor: pointer; }
  .user-chip:hover { background: var(--track); }
  .avatar {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
    font-size: 12px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
  }

  /* ───────────── MAIN ───────────── */
  .main { min-width: 0; display: flex; flex-direction: column; height: 100vh; background-image: var(--bg-glow); }
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    padding: 24px 30px 18px; flex: 0 0 auto;
  }
  .topbar h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  .topbar p  { margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .month-nav {
    display: flex; align-items: center; gap: 4px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 11px; padding: 4px;
  }
  .month-nav span {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600;
    text-transform: capitalize; padding: 0 8px; min-width: 134px; justify-content: center;
  }
  .month-nav button {
    width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: var(--text-dim); display: grid; place-items: center;
  }
  .month-nav button:hover:not(:disabled) { background: var(--track); color: var(--text); }
  .month-nav button:disabled { opacity: .3; cursor: not-allowed; }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 30px 40px; }
  .view { max-width: 1280px; }

  /* ───────────── BOTONES ───────────── */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 11px;
    border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 650;
    transition: filter .15s, transform .1s;
    box-shadow: 0 4px 14px color-mix(in oklab, var(--accent) 30%, transparent);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary.lg, .btn-ghost.lg { padding: 13px 18px; font-size: 14px; justify-content: center; }
  .btn-ghost {
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    padding: 6px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600; transition: all .14s;
  }
  .btn-ghost:hover { color: var(--text); background: var(--track); }
  .btn-soft {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--track); color: var(--text); font-size: 13px; font-weight: 600;
    transition: background .14s, border-color .14s; width: 100%; justify-content: center;
  }
  .btn-soft:hover { background: var(--track-strong); border-color: var(--track-strong); }
  .btn-soft:disabled { opacity: .4; cursor: not-allowed; }
  .btn-danger {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 11px;
    border: none; background: color-mix(in oklab, var(--expense) 16%, transparent);
    color: var(--expense); font-size: 13px; font-weight: 650; transition: background .14s;
  }
  .btn-danger.lg { padding: 13px 18px; font-size: 14px; justify-content: center; }
  .btn-danger:hover { background: color-mix(in oklab, var(--expense) 26%, transparent); }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); display: grid; place-items: center; transition: all .14s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--track-strong); }
  .icon-btn.ring { position: relative; }
  .icon-btn.ring::after {
    content: ""; position: absolute; top: 9px; right: 10px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--expense); border: 2px solid var(--surface);
  }

  /* ───────────── CONTROLES ───────────── */
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: var(--text-dim); padding: 7px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600; transition: all .14s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg.seg-lg { width: 100%; padding: 4px; }
  .seg.seg-lg button { flex: 1; padding: 11px; font-size: 13.5px; }
  .select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 11px; padding: 9px 12px; font-size: 13px; outline: none; transition: border-color .14s;
  }
  .select:focus { border-color: var(--accent); }
  .search {
    display: flex; align-items: center; gap: 9px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 11px; padding: 0 13px;
    flex: 1; min-width: 180px; max-width: 320px;
  }
  .search input {
    border: none; background: transparent; color: var(--text); outline: none;
    padding: 10px 0; font-size: 13px; width: 100%;
  }
  .search input::placeholder { color: var(--text-dim); }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }

  /* ───────────── CARDS / GRIDS ───────────── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--card-pad);
  }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .grid-2-1 { display: grid; grid-template-columns: 1.55fr 1fr; gap: var(--gap); }
  .grid-1-1 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .grid-acc { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--gap); }
  .acct-card, .goal-card { display: flex; flex-direction: column; }

  /* fila de transacción */
  .txrow {
    display: flex; align-items: center; gap: 13px; padding: 9px 8px;
    border-radius: 11px; cursor: default; transition: background .12s;
  }
  .txrow:hover { background: var(--track); }

  /* nota de reinicio */
  .reset-note {
    display: flex; align-items: center; gap: 10px;
    background: color-mix(in oklab, var(--accent) 9%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
    border-radius: 13px; padding: 13px 16px; font-size: 13px; color: var(--text-dim);
  }

  /* ───────────── MODAL ───────────── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4,7,12,.62);
    backdrop-filter: blur(5px); display: grid; place-items: center;
    z-index: 200; padding: 20px; animation: fade .15s ease;
  }
  .modal {
    width: 100%; max-width: 460px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 20px; padding: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: pop .18s ease;
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop  { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  .amount-field {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
  }
  .amount-field span { font-size: 18px; font-weight: 700; color: var(--text-dim); }
  .amount-field input {
    border: none; background: transparent; color: var(--text); outline: none;
    font-size: 30px; font-weight: 750; width: 100%;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .amount-field input::-webkit-outer-spin-button,
  .amount-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field { margin-top: 16px; }
  .field > label { display: block; font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; }
  .field .select, .field input.select { width: 100%; }
  .field-row { display: flex; gap: 12px; margin-top: 16px; }
  .cat-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-opt {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 11px 6px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); font-size: 11px; font-weight: 550;
    transition: all .12s; text-align: center;
  }
  .cat-opt:hover { color: var(--text); border-color: var(--track-strong); }
  .cat-opt.on { color: var(--text); }

  /* ───────────── MENU POPUP ───────────── */
  .menu-pop {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 100;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.45);
    padding: 6px; min-width: 190px;
  }
  .menu-pop button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 12px; border-radius: 9px; border: none; background: transparent;
    color: var(--text); font-size: 13px; font-weight: 550; text-align: left; transition: background .12s;
  }
  .menu-pop button:hover { background: var(--track); }

  /* ───────────── EMPTY STATE ───────────── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 52px 24px; text-align: center;
  }
  .empty-ico {
    width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
    color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent);
  }
  .empty-state h3 { margin: 0; font-size: 16px; font-weight: 650; color: var(--text); }
  .empty-state p  { margin: 0; font-size: 13.5px; color: var(--text-dim); max-width: 300px; line-height: 1.55; }

  /* ───────────── WELCOME / ONBOARDING ───────────── */
  .welcome-overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 300; padding: 24px;
    background-image: var(--bg-glow);
  }
  .welcome {
    max-width: 460px; width: 100%; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    animation: pop .3s ease;
  }
  .welcome-mark {
    width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent) 60%, var(--accent2)));
    box-shadow: 0 8px 30px color-mix(in oklab, var(--accent) 45%, transparent);
  }
  .welcome h1 { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -.035em; }
  .welcome > p { margin: 0; font-size: 15px; color: var(--text-dim); line-height: 1.6; max-width: 380px; }
  .welcome-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .welcome-feats {
    display: flex; flex-direction: column; gap: 9px; font-size: 13px;
    color: var(--text-dim); text-align: left; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; width: 100%;
  }
  .welcome-feats span { display: flex; align-items: center; gap: 10px; }

  /* ───────────── BUDGET INPUT ───────────── */
  .budget-input {
    display: flex; align-items: center; gap: 6px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: 0 10px;
  }
  .budget-input > span { font-size: 12px; color: var(--text-dim); font-weight: 600; flex: 0 0 auto; }
  .budget-input input {
    border: none; background: transparent; color: var(--text); outline: none;
    font-size: 13px; width: 90px; padding: 7px 0;
    font-variant-numeric: tabular-nums; font-family: inherit;
  }

  /* ───────────── TOASTS ───────────── */
  .toast-host {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    z-index: 600; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 18px;
    font-size: 13px; font-weight: 600; box-shadow: 0 10px 28px rgba(0,0,0,.5);
    color: var(--text); animation: pop .2s ease; white-space: nowrap;
  }
  .toast.ok { border-color: color-mix(in oklab, var(--income) 40%, transparent); color: var(--income); }

  /* ───────────── RESPONSIVE ───────────── */
  @media (max-width: 1080px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-2-1, .grid-1-1 { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .sidebar { width: 64px; padding: 18px 10px; }
    .brand-name, .nav-item > span, .add-fab > span,
    .user-chip > div { display: none !important; }
    .nav-item { justify-content: center; }
    .add-fab { padding: 11px; }
    .grid-3 { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; padding: 18px; }
    .scroll { padding: 6px 16px 40px; }
    .topbar-right { width: 100%; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel (UMD / standalone) -->

          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
