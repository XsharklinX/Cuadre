[package]
name = "tauri-plugin-local-reminders"
version = "0.1.0"
edition = "2021"
description = "Recordatorios locales en segundo plano (WorkManager) para pagos recurrentes y presupuestos"
links = "tauri-plugin-local-reminders"

[lib]
name = "tauri_plugin_local_reminders"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
