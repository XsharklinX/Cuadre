[package]
name = "tauri-plugin-mlkit-ocr"
version = "0.1.0"
edition = "2021"
description = "Reconocimiento de texto on-device con Google ML Kit (Android)"
links = "tauri-plugin-mlkit-ocr"

[lib]
name = "tauri_plugin_mlkit_ocr"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
