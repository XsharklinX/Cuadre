[package]
name = "tauri-plugin-home-widget"
version = "0.1.0"
edition = "2021"
description = "Widget de pantalla de inicio (saldo, presupuesto, proximo pago) para Android"
links = "tauri-plugin-home-widget"

[lib]
name = "tauri_plugin_home_widget"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
