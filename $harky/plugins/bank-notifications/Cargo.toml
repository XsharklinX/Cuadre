[package]
name = "tauri-plugin-bank-notifications"
version = "0.1.0"
edition = "2021"
description = "Acceso a notificaciones del sistema (NotificationListenerService) para detectar transacciones bancarias"
links = "tauri-plugin-bank-notifications"

[lib]
name = "tauri_plugin_bank_notifications"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
