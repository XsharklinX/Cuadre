<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#111827"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffdd3d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffdd3d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Bar chart columns (subtle, bottom) -->
  <rect x="72"  y="330" width="44" height="90" rx="8" fill="#ffdd3d" opacity="0.12"/>
  <rect x="136" y="295" width="44" height="125" rx="8" fill="#ffdd3d" opacity="0.12"/>
  <rect x="200" y="270" width="44" height="150" rx="8" fill="#ffdd3d" opacity="0.12"/>
  <rect x="264" y="230" width="44" height="190" rx="8" fill="#ffdd3d" opacity="0.15"/>
  <rect x="328" y="175" width="44" height="245" rx="8" fill="#ffdd3d" opacity="0.18"/>
  <rect x="392" y="128" width="44" height="292" rx="8" fill="#ffdd3d" opacity="0.22"/>

  <!-- Trend line — upward, bold -->
  <polyline
    points="94,352 158,316 222,290 286,248 350,194 414,148"
    fill="none"
    stroke="url(#line-grad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Data point dots -->
  <circle cx="94"  cy="352" r="10" fill="#ffdd3d" opacity="0.5"/>
  <circle cx="158" cy="316" r="10" fill="#ffdd3d" opacity="0.5"/>
  <circle cx="222" cy="290" r="10" fill="#ffdd3d" opacity="0.5"/>
  <circle cx="286" cy="248" r="10" fill="#ffdd3d" opacity="0.6"/>
  <circle cx="350" cy="194" r="10" fill="#ffdd3d" opacity="0.7"/>

  <!-- Last data point — highlighted -->
  <circle cx="414" cy="148" r="20" fill="#ffdd3d"/>
  <circle cx="414" cy="148" r="10" fill="#111827"/>
</svg>
