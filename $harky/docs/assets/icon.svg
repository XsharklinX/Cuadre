<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo oscuro con sutil profundidad -->
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#0E1E38"/>
      <stop offset="100%" stop-color="#070C18"/>
    </radialGradient>
    <!-- Brillo sutil en la línea blanca -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo: cuadrado redondeado oscuro azul-negro -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!--
    La marca: fin de tiburón que es también una línea de tendencia.
    Asimétrica: lado izquierdo empinado (frente del fin),
    lado derecho más gradual (espalda del fin).
    Tres puntos:
      A = base izquierda (76, 388)
      B = pico del fin  (256, 88)   ← el "$ accent" azul va aquí
      C = descenso derecho (426, 268)
  -->

  <!-- Línea principal: blanca, trazo grueso -->
  <polyline
    points="76,388 256,88 426,268"
    fill="none"
    stroke="white"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft-glow)"
    opacity="0.96"
  />

  <!-- Punto accent azul en el pico — el "fin tip" -->
  <circle cx="256" cy="88" r="30" fill="#3B82F6"/>
  <!-- Brillo interior del punto -->
  <circle cx="248" cy="80" r="10" fill="#93C5FD" opacity="0.6"/>

  <!-- Línea de agua — sutil, azul oscuro, línea base del océano -->
  <line x1="58" y1="416" x2="454" y2="416"
    stroke="#3B82F6" stroke-width="7"
    stroke-linecap="round" opacity="0.28"/>
</svg>
