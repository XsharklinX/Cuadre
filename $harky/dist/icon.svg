<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow-dot" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#080F1E"/>

  <!-- Peak lines: left arm and right arm -->
  <line x1="74" y1="385" x2="256" y2="148"
        stroke="#D4E4F5" stroke-width="26" stroke-linecap="round"
        filter="url(#glow-line)"/>
  <line x1="256" y1="148" x2="438" y2="385"
        stroke="#D4E4F5" stroke-width="26" stroke-linecap="round"
        filter="url(#glow-line)"/>

  <!-- Blue dot glow -->
  <circle cx="256" cy="148" r="38" fill="#3B6FFF" opacity="0.20" filter="url(#glow-dot)"/>

  <!-- Blue dot -->
  <circle cx="256" cy="148" r="22" fill="#4D82FF"/>

  <!-- Horizontal baseline -->
  <line x1="58" y1="422" x2="454" y2="422"
        stroke="#3B6FFF" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
</svg>
